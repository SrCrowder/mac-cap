name: Build MacCap

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Tests
        run: swift test

      - name: Build MacCap.app (universal)
        env:
          MACCAP_VERSION: 1.1.${{ github.run_number }}
        run: ./build-app.sh

      - name: Package .zip and .dmg
        run: |
          cd build
          lipo -info MacCap.app/Contents/MacOS/MacCap
          codesign --verify --verbose MacCap.app
          ditto -c -k --sequesterRsrc --keepParent MacCap.app MacCap.zip
          mkdir -p dmg
          cp -R MacCap.app dmg/
          ln -s /Applications dmg/Applications
          for attempt in 1 2 3 4; do
            hdiutil create -volname MacCap -srcfolder dmg -ov -format UDZO MacCap.dmg && break
            sleep $((attempt * 5))
          done
          test -f MacCap.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: MacCap
          path: |
            build/MacCap.dmg
            build/MacCap.zip

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/MacCap.dmg build/MacCap.zip \
            --target "$GITHUB_SHA" \
            --title "MacCap (última compilación)" \
            --notes "Compilación automática de \`main\` (${GITHUB_SHA::7}). Descarga **MacCap.dmg**, arrastra MacCap a Aplicaciones y consulta el README para el primer arranque."

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/MacCap.dmg build/MacCap.zip --generate-notes
