name: Build MacCap

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with Package.swift.
  SPARKLE_VERSION: 2.10.1
  # SHA-256 of Sparkle-$SPARKLE_VERSION.tar.xz (matches the digest GitHub shows for the release asset).
  SPARKLE_SHA256: 1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Tests
        run: swift test

      - name: Import signing certificate
        id: signing
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-certificate -c "MacCap Self-Signed" -Z "$keychain" | awk '/SHA-1/ {print $3}')"
          test -n "$identity"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build MacCap.app (universal)
        env:
          MACCAP_VERSION: 1.1.${{ github.run_number }}
          MACCAP_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          ./build-app.sh
          codesign -d -r- build/MacCap.app 2>&1 | grep designated
          codesign -dv build/MacCap.app 2>&1 | grep -E "flags=.*runtime"
          codesign -d --entitlements - build/MacCap.app

      - name: Package .zip and .dmg
        run: |
          cd build
          lipo -info MacCap.app/Contents/MacOS/MacCap
          ditto -c -k --sequesterRsrc --keepParent MacCap.app MacCap.zip
          mkdir -p dmg
          cp -R MacCap.app dmg/
          ln -s /Applications dmg/Applications
          for attempt in 1 2 3 4; do
            hdiutil create -volname MacCap -srcfolder dmg -ov -format UDZO MacCap.dmg && break
            sleep $((attempt * 5))
          done
          test -f MacCap.dmg

      - name: Create appcast (Sparkle update feed)
        if: github.event_name != 'pull_request'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          signature="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - build/MacCap.zip)"
          echo "$signature"
          plist=build/MacCap.app/Contents/Info.plist
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag=latest; fi
          cat > build/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>MacCap</title>
              <item>
                <title>MacCap $short</title>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$version</sparkle:version>
                <sparkle:shortVersionString>$short</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>12.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_SHA</sparkle:releaseNotesLink>
                <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/MacCap.zip"
                           type="application/octet-stream" $signature />
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout build/appcast.xml
          cat build/appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: MacCap
          path: |
            build/MacCap.dmg
            build/MacCap.zip

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/MacCap.dmg build/MacCap.zip build/appcast.xml \
            --target "$GITHUB_SHA" \
            --latest \
            --title "MacCap (última compilación)" \
            --notes "Compilación automática de \`main\` (${GITHUB_SHA::7}). Descarga **MacCap.dmg** y arrastra MacCap a Aplicaciones. Las versiones instaladas se actualizan solas."

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/MacCap.dmg build/MacCap.zip build/appcast.xml --generate-notes --latest
